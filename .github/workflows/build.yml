name: build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Integration tests mount via FUSE and skip themselves when /dev/fuse or fusermount3 is unavailable.
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Smoke
        run: target/release/fusecache --version

      - uses: actions/upload-artifact@v4
        with:
          name: fusecache-x86_64-linux-gnu
          path: target/release/fusecache
          if-no-files-found: error

  # Pushing a tag like v0.1.0 publishes the binary built above as a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fusecache-x86_64-linux-gnu
          path: dist

      - name: Package
        run: |
          name="fusecache-${GITHUB_REF_NAME}-x86_64-linux-gnu"
          mkdir "$name"
          install -m 755 dist/fusecache "$name/fusecache"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fusecache-*.tar.gz
            fusecache-*.tar.gz.sha256
          generate_release_notes: true
