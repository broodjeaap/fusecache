[package]
name = "fusecache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "FUSE storage tiering: SSD read cache and SSD write-back cache over an HDD backing directory"
license-file = "LICENSE"

[dependencies]
fuser = "0.18"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
libc = "0.2"
bytesize = "2"
humantime = "2"

[dev-dependencies]
tempfile = "3"
